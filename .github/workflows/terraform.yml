name: "Terraform Workflow"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      aws-region:
        type: string
        required: true
      destroy:
        type: boolean
        required: false
        default: false
      
jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go and build Lambda
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Build and package Lambda
        run: |
          cd app
          go mod download
          go mod tidy
          echo "🔨 Building Lambda"
          
          # Build para Linux (compatível com Lambda)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -ldflags="-s -w -extldflags=-static" \
              -o bootstrap \
              cmd/api/main.go
          
          if [ $? -eq 0 ]; then
              echo "✅ Build successful!"
              
              # Tornar executável
              chmod +x bootstrap
              
              # Criar ZIP
              echo "📦 Creating lambda.zip..."
              zip -j lambda.zip bootstrap
              
              if [ $? -eq 0 ]; then
                  echo "✅ Lambda package created successfully!"
                  echo "📊 File sizes:"
                  ls -lh bootstrap lambda.zip
              else
                  echo "❌ Failed to create lambda.zip"
                  exit 1
              fi
          else
              echo "❌ Build failed!"
              exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_version: 1.8.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform init with S3 backend
        run: |
          cd terraform && terraform init -reconfigure

      - name: Terraform workspace
        run: |
          cd terraform && terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}

      - name: Terraform Plan or Destroy
        run: |
          if [ "${{ inputs.destroy }}" = "true" ]; then
            echo "Destroying resources..."
            cd terraform && terraform destroy -auto-approve
          else
            echo "Planning and applying resources..."
            cd terraform && terraform plan -out="${{ inputs.environment }}.plan"
            terraform apply "${{ inputs.environment }}.plan"
          fi

      - name: Update Lambda Code
        if: inputs.destroy == false
        run: |
          aws lambda update-function-code \
            --function-name MorangoPay-API \
            --zip-file fileb://app/lambda.zip \
            --region ${{ inputs.aws-region }}
          