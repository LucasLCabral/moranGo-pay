name: "PROD DEPLOY"

on: 
  push: 
    branches: 
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: default # WATCH OUT! USE THE CORRECT ENVIRONMENT NAME :(
      aws-region: "sa-east-1"
      destroy: false
